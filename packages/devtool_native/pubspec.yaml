name: devtool_native
description: >-
  Native bridge for devtool (crash probe). Defines the MethodChannel contract;
  the host app registers the native handler. Keep out of release builds.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.snapmaker.devtool_native
        pluginClass: DevtoolNativePlugin
      ios:
        pluginClass: DevtoolNativePlugin
